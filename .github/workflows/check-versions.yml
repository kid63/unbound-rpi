name: Check upstream versions

on:
  workflow_dispatch:
  schedule:
    # täglich 07:00 Uhr MEZ / 08:00 Uhr MESZ
    - cron: "0 6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  versions:
    name: Check Unbound and OpenSSL versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          #
          # Aktuellstes Unbound-Verzeichnis im Repo finden
          #
          CURRENT_DIR="$(
            find . -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1
          )"

          if [[ -z "${CURRENT_DIR}" ]]; then
            echo "Kein Unbound-Versionsverzeichnis gefunden."
            exit 1
          fi

          DOCKERFILE="${CURRENT_DIR}/Dockerfile"

          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "Dockerfile nicht gefunden: ${DOCKERFILE}"
            exit 1
          fi


          #
          # Aktuelle Versionen aus unserem Dockerfile
          #
          CURRENT_UNBOUND="$(
            sed -nE 's/^ARG UNBOUND_VERSION=([0-9.]+)$/\1/p' \
              "${DOCKERFILE}"
          )"

          CURRENT_OPENSSL="$(
            sed -nE \
              's/.*VERSION_OPENSSL=openssl-([0-9.]+).*/\1/p' \
              "${DOCKERFILE}"
          )"


          #
          # Neueste stabile Unbound-Version
          #
          LATEST_UNBOUND="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/NLnetLabs/unbound.git \
              'refs/tags/release-*' \
            | awk -F/ '{print $3}' \
            | sed -nE \
                's/^release-([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            | sort -V \
            | tail -1
          )"


          #
          # OpenSSL-LTS-Serie aus unserer Version bestimmen
          # 3.5.9 -> 3.5
          #
          OPENSSL_SERIES="$(
            echo "${CURRENT_OPENSSL}" \
              | cut -d. -f1,2
          )"

          OPENSSL_SERIES_REGEX="${OPENSSL_SERIES//./\\.}"


          #
          # Neueste stabile Version innerhalb unserer LTS-Serie
          #
          LATEST_OPENSSL="$(
            git ls-remote \
              --tags \
              --refs \
              https://github.com/openssl/openssl.git \
              "refs/tags/openssl-${OPENSSL_SERIES}.*" \
            | awk -F/ '{print $3}' \
            | sed 's/^openssl-//' \
            | grep -E \
                "^${OPENSSL_SERIES_REGEX}\.[0-9]+$" \
            | sort -V \
            | tail -1
          )"


          #
          # Sicherheitscheck
          #
          if [[ -z "${CURRENT_UNBOUND}" ||
                -z "${LATEST_UNBOUND}" ||
                -z "${CURRENT_OPENSSL}" ||
                -z "${LATEST_OPENSSL}" ]]; then
            echo "Fehler beim Ermitteln der Versionsnummern."
            exit 1
          fi


          #
          # Ausgabe
          #
          echo
          echo "========================================"
          echo " Unbound"
          echo "========================================"
          echo " Current : ${CURRENT_UNBOUND}"
          echo " Latest  : ${LATEST_UNBOUND}"
          echo
          echo "========================================"
          echo " OpenSSL ${OPENSSL_SERIES} LTS"
          echo "========================================"
          echo " Current : ${CURRENT_OPENSSL}"
          echo " Latest  : ${LATEST_OPENSSL}"
          echo


          #
          # Outputs für unseren späteren Build-Job
          #
          echo "current_unbound=${CURRENT_UNBOUND}" >> "${GITHUB_OUTPUT}"
          echo "latest_unbound=${LATEST_UNBOUND}"   >> "${GITHUB_OUTPUT}"
          echo "current_openssl=${CURRENT_OPENSSL}" >> "${GITHUB_OUTPUT}"
          echo "latest_openssl=${LATEST_OPENSSL}"   >> "${GITHUB_OUTPUT}"


          #
          # GitHub Job Summary
          #
          {
            echo "## Version check"
            echo
            echo "| Software | Current | Latest |"
            echo "|----------|---------|--------|"
            echo "| Unbound | ${CURRENT_UNBOUND} | ${LATEST_UNBOUND} |"
            echo "| OpenSSL ${OPENSSL_SERIES} LTS | ${CURRENT_OPENSSL} | ${LATEST_OPENSSL} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${LATEST_UNBOUND}" != "${CURRENT_UNBOUND}" ]]; then
          UNBOUND_UPDATE=true
          else
          UNBOUND_UPDATE=false
          fi

          if [[ "${LATEST_OPENSSL}" != "${CURRENT_OPENSSL}" ]]; then
          OPENSSL_UPDATE=true
          else
          OPENSSL_UPDATE=false
          fi

          echo "unbound_update=${UNBOUND_UPDATE}" >> "${GITHUB_OUTPUT}"
          echo "openssl_update=${OPENSSL_UPDATE}" >> "${GITHUB_OUTPUT}"

      - name: Check upstream SHA256
        id: checksums
        shell: bash
        env:
          CURRENT_UNBOUND: ${{ steps.versions.outputs.current_unbound }}
          LATEST_UNBOUND: ${{ steps.versions.outputs.latest_unbound }}
          LATEST_OPENSSL: ${{ steps.versions.outputs.latest_openssl }}
        run: |
          set -euo pipefail

          DOCKERFILE="${CURRENT_UNBOUND}/Dockerfile"

          REPO_UNBOUND_SHA="$(
            sed -nE 's/.*UNBOUND_SHA256=([a-f0-9]{64}).*/\1/p' \
              "${DOCKERFILE}"
          )"

          REPO_OPENSSL_SHA="$(
            sed -nE 's/.*SHA256_OPENSSL=([a-f0-9]{64}).*/\1/p' \
              "${DOCKERFILE}"
          )"

          UPSTREAM_UNBOUND_SHA="$(
            curl -fsSL \
              "https://nlnetlabs.nl/downloads/unbound/unbound-${LATEST_UNBOUND}.tar.gz.sha256" \
            | awk '{print $1}'
          )"

          UPSTREAM_OPENSSL_SHA="$(
            curl -fsSL \
              "https://github.com/openssl/openssl/releases/download/openssl-${LATEST_OPENSSL}/openssl-${LATEST_OPENSSL}.tar.gz.sha256" \
            | awk '{print $1}'
          )"

          [[ "${UPSTREAM_UNBOUND_SHA}" =~ ^[a-f0-9]{64}$ ]]
          [[ "${UPSTREAM_OPENSSL_SHA}" =~ ^[a-f0-9]{64}$ ]]

          echo
          echo "Unbound SHA256"
          echo "Repo     : ${REPO_UNBOUND_SHA}"
          echo "Upstream : ${UPSTREAM_UNBOUND_SHA}"
          echo
          echo "OpenSSL SHA256"
          echo "Repo     : ${REPO_OPENSSL_SHA}"
          echo "Upstream : ${UPSTREAM_OPENSSL_SHA}"

          echo "unbound_sha=${UPSTREAM_UNBOUND_SHA}" >> "${GITHUB_OUTPUT}"
          echo "openssl_sha=${UPSTREAM_OPENSSL_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Update Dockerfile
        if: ${{ steps.versions.outputs.unbound_update == 'true' || steps.versions.outputs.openssl_update == 'true' }}
        shell: bash
        env:
          CURRENT_UNBOUND: ${{ steps.versions.outputs.current_unbound }}
          LATEST_UNBOUND: ${{ steps.versions.outputs.latest_unbound }}
          CURRENT_OPENSSL: ${{ steps.versions.outputs.current_openssl }}
          LATEST_OPENSSL: ${{ steps.versions.outputs.latest_openssl }}
          UNBOUND_UPDATE: ${{ steps.versions.outputs.unbound_update }}
          OPENSSL_UPDATE: ${{ steps.versions.outputs.openssl_update }}
          UNBOUND_SHA: ${{ steps.checksums.outputs.unbound_sha }}
          OPENSSL_SHA: ${{ steps.checksums.outputs.openssl_sha }}
        run: |
          set -euo pipefail

          TARGET_DIR="${CURRENT_UNBOUND}"

          if [[ "${UNBOUND_UPDATE}" == "true" ]]; then
            TARGET_DIR="${LATEST_UNBOUND}"

            if [[ -e "${TARGET_DIR}" ]]; then
              echo "Zielverzeichnis ${TARGET_DIR} existiert bereits."
              exit 1
            fi

            cp -a "${CURRENT_UNBOUND}" "${TARGET_DIR}"
          fi

          DOCKERFILE="${TARGET_DIR}/Dockerfile"

          if [[ "${UNBOUND_UPDATE}" == "true" ]]; then
            sed -i -E \
              "s/^ARG UNBOUND_VERSION=.*/ARG UNBOUND_VERSION=${LATEST_UNBOUND}/" \
              "${DOCKERFILE}"

            sed -i -E \
              "s/UNBOUND_SHA256=[a-f0-9]{64}/UNBOUND_SHA256=${UNBOUND_SHA}/" \
              "${DOCKERFILE}"
          fi

          if [[ "${OPENSSL_UPDATE}" == "true" ]]; then
            sed -i -E \
              "s/VERSION_OPENSSL=openssl-[0-9.]+/VERSION_OPENSSL=openssl-${LATEST_OPENSSL}/" \
              "${DOCKERFILE}"

            sed -i -E \
              "s/SHA256_OPENSSL=[a-f0-9]{64}/SHA256_OPENSSL=${OPENSSL_SHA}/" \
              "${DOCKERFILE}"
          fi

          git diff -- "${TARGET_DIR}"

      - name: Commit and push update
        if: ${{ steps.versions.outputs.unbound_update == 'true' || steps.versions.outputs.openssl_update == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_UNBOUND: ${{ steps.versions.outputs.latest_unbound }}
          LATEST_OPENSSL: ${{ steps.versions.outputs.latest_openssl }}
          UNBOUND_UPDATE: ${{ steps.versions.outputs.unbound_update }}
          OPENSSL_UPDATE: ${{ steps.versions.outputs.openssl_update }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi

          if [[ "${UNBOUND_UPDATE}" == "true" && "${OPENSSL_UPDATE}" == "true" ]]; then
            COMMIT_MSG="Update Unbound to ${LATEST_UNBOUND} and OpenSSL to ${LATEST_OPENSSL}"
          elif [[ "${UNBOUND_UPDATE}" == "true" ]]; then
            COMMIT_MSG="Update Unbound to ${LATEST_UNBOUND}"
          else
            COMMIT_MSG="Update OpenSSL to ${LATEST_OPENSSL}"
          fi

          git commit -m "${COMMIT_MSG}"
          git push
          gh workflow run update.yml --ref main
          
